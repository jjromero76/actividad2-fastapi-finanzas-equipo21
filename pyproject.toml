[project]
name = "actividad2-fastapi-finanzas-equipo21"
version = "0.1.0"
description = ""
authors = [
    {name = "Jhon Romero",email = "jhonjairoromero@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi (>=0.115.0,<1.0.0)",
    "joblib (>=1.4.0,<2.0.0)",
    "mlflow (>=3.14.0,<4.0.0)",
    "numpy (>=2.1.0,<3.0.0)",
    "pandas (>=2.2.0,<3.0.0)",
    "pydantic (>=2.0.0,<3.0.0)",
    "scikit-learn (>=1.5.0,<2.0.0)",
    "uvicorn (>=0.30.0,<1.0.0)",
    "yfinance (>=1.5.2,<2.0.0)"
]

[tool.poetry]
packages = [{ include = "financial_api", from = "src" }]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "httpx2 (>=2.9.1,<3.0.0)"
]
